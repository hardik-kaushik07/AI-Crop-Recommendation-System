<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | CropWise AI</title>

    <link rel="stylesheet" href="css/auth.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="login-container">

    <!-- Left Side -->

    <div class="left-panel">

        <div class="overlay">

            <h1>

                🌱 CropWise AI

            </h1>

            <h2>

                Smart Agriculture

                Powered by AI

            </h2>

            <p>

                Upload farm images, ask farming questions,

                analyze soil, receive crop recommendations,

                and manage your farming history

                with Artificial Intelligence.

            </p>

        </div>

    </div>

    <!-- Right Side -->

    <div class="right-panel">

        <div class="login-card">

            <h2>

                Welcome Back 👋

            </h2>

            <p>

                Login to continue

            </p>

            <form id="loginForm">

                <!-- Email -->

                <div class="input-box">

                    <label>

                        Email Address

                    </label>

                    <input

                            type="email"

                            id="email"

                            placeholder="Enter your email"

                            required>

                </div>

                <!-- Password -->

                <div class="input-box">

                    <label>

                        Password

                    </label>

                    <div class="password-box">

                        <input

                                type="password"

                                id="password"

                                placeholder="Enter password"

                                required>

                        <span
                                id="togglePassword"
                                class="toggle-password">

                            👁

                        </span>

                    </div>

                </div>

                <div
                        id="loginMessage"
                        class="message">

                </div>

                <button
                        type="submit"
                        class="login-btn">

                    Login

                </button>

            </form>

            <div class="divider">

                OR

            </div>

            <p class="register-text">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

            <a

                    href="index.html"

                    class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>

</div>

<script src="js/config.js"></script>

<script src="js/login.js"></script>

</body>

</html>
