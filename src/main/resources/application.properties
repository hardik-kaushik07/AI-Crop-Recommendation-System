spring.application.name=FarmApp

spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jackson.deserialization.fail-on-unknown-properties=false


###########################  Weather Api ################################################

weather.api.key=${WEATHER_API_KEY}


spring.ai.google.genai.api-key=${GEMINI_API_KEY}
#spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL}

spring.ai.google.genai.chat.options.model=${GEMINI_MODEL}

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=text-embedding-004




logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


########################  Uploads Documents #############################################

app.document.upload-dir=/app/uploads/documents

spring.config.import=optional:file:.env[.properties]